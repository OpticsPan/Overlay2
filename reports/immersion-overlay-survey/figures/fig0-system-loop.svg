<polygon points="1338,357 1343.451856792321,369.8948539160404 1332.548143207679,369.8948539160404" fill="#b67718"/>
<text x="1357" y="395" fill="#b67718" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">反馈</text>
<rect x="42" y="475" width="390" height="187" rx="15" fill="#fff8e9" stroke="#b67718" stroke-width="2"/>
<text x="64" y="495" fill="#b67718" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">L4 后续技术接口</text>
<text x="64" y="541" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">协方差识别、MA / MSD</text>
<text x="64" y="580" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">像差敏感度、采样优化</text>
<text x="64" y="619" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">测量偏差与工艺迁移</text>
<polyline points="432,560 590,560" fill="none" stroke="#b67718" stroke-width="3"/>
<polygon points="590,560 577.1051460839597,565.4518567923211 577.1051460839597,554.5481432076789" fill="#b67718"/>
<text x="42" y="742" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">输出：可追溯的预算表 + 物理责任边界 + 整机验收条件；不能只靠预算加总证明设备达标。</text>
</svg>
