<text x="1160" y="190" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">量测与校准</text>
<text x="1160" y="236" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">基准晶圆、对准标记</text>
<text x="1160" y="275" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">网格 / 物镜 / 热模型标定</text>
<text x="1160" y="314" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">采样覆盖与测量不确定度</text>
<polyline points="432,260 590,260" fill="none" stroke="#087f8c" stroke-width="4"/>
