<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="810" viewBox="0 0 1580 810">
<rect width="100%" height="100%" fill="white"/>
<text x="42" y="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" dominant-baseline="text-before-edge">图 0  从产品边缘要求到整机预算与验证</text>
<text x="42" y="88" fill="#52687d" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">本文综合示意；箭头表示信息或校正的传递，不代表 ASML 内部软件结构。</text>
<rect x="42" y="170" width="390" height="187" rx="15" fill="#eff8f8" stroke="#16324f" stroke-width="2"/>
<text x="64" y="190" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">产品与层对</text>
<text x="64" y="236" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">电路类型、实际 CD / pitch</text>
<text x="64" y="275" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">关键边缘间距与 EPE 限值</text>
<text x="64" y="314" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">ADI / AEI、采样与统计量</text>
<rect x="590" y="170" width="390" height="187" rx="15" fill="#eff8f8" stroke="#16324f" stroke-width="2"/>
<text x="612" y="190" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">总体分配与模型</text>
<text x="612" y="236" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">DCO → MMO → 产品套刻</text>
<text x="612" y="275" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">误差归属、均值、协方差</text>
<text x="612" y="314" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">校正范围与校正后残差</text>
