<polyline points="1138,260 980,260" fill="none" stroke="#087f8c" stroke-width="4"/>
<polygon points="980,260 992.8948539160403,254.5481432076789 992.8948539160403,265.4518567923211" fill="#087f8c"/>
<rect x="590" y="475" width="390" height="187" rx="15" fill="#eff8f8" stroke="#087f8c" stroke-width="2"/>
<text x="612" y="495" fill="#087f8c" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">机台执行</text>
<text x="612" y="541" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">运动台、对准、投影物镜</text>
<text x="612" y="580" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">晶圆与掩模夹持 / 热管理</text>
<text x="612" y="619" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">执行能力和在线补偿</text>
<rect x="1138" y="475" width="400" height="187" rx="15" fill="#eff8f8" stroke="#087f8c" stroke-width="2"/>
<text x="1160" y="495" fill="#087f8c" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">验证与工艺反馈</text>
<text x="1160" y="541" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">标准片 DCO / MMO</text>
<text x="1160" y="580" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">产品 ADI → AEI → EPE</text>
<text x="1160" y="619" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">跨批次漂移与模型复核</text>
<polyline points="785,357 785,475" fill="none" stroke="#087f8c" stroke-width="4"/>
<polygon points="785,475 779.5481432076789,462.1051460839596 790.4518567923211,462.1051460839596" fill="#087f8c"/>
