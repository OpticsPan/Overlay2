<text x="1222" y="686" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">0.70  |  0.45 nm</text>
<rect x="1200" y="760" width="568" height="109" rx="15" fill="#eff8f8" stroke="#087f8c" stroke-width="2"/>
