<text x="64" y="586" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">≤ 5.50 | ≤ 2.50 nm</text>
<text x="64" y="625" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">R = 5.022 | 2.203 nm</text>
<text x="64" y="664" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">B = 0.35 | 0.20 nm</text>
<text x="64" y="703" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">Q = 5.372 | 2.403 nm</text>
<text x="60" y="797" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" dominant-baseline="text-before-edge">上层 RSS 只传递 R。</text>
<text x="60" y="842" fill="#52687d" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">B 为该输出的总均值界，</text>
<text x="60" y="883" fill="#52687d" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">不把下层 B 再加一遍。</text>
<rect x="600" y="340" width="480" height="226" rx="15" fill="#eff8f8" stroke="#16324f" stroke-width="2"/>
<text x="622" y="360" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">DCO 数值锚点</text>
<text x="622" y="406" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">≤ 2.50 | ≤ 1.60 nm</text>
<text x="622" y="445" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">R = 2.130 | 1.307 nm</text>
<text x="622" y="484" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">B = 0.25 | 0.15 nm</text>
<text x="622" y="523" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">Q = 2.380 | 1.457 nm</text>
<rect x="600" y="680" width="480" height="109" rx="15" fill="#eff8f8" stroke="#16324f" stroke-width="2"/>
<text x="622" y="700" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">新增网格匹配残差</text>
<text x="622" y="746" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">3.60  |  1.35 nm</text>
<rect x="600" y="840" width="480" height="109" rx="15" fill="#eff8f8" stroke="#16324f" stroke-width="2"/>
<text x="622" y="860" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">新增物镜指纹差残差</text>
<text x="622" y="906" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">2.40  |  0.95 nm</text>
<rect x="600" y="1000" width="480" height="109" rx="15" fill="#eff8f8" stroke="#16324f" stroke-width="2"/>
<text x="622" y="1020" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">匹配设定 / 迁移残差</text>
<text x="622" y="1066" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">1.40  |  0.65 nm</text>
<rect x="1200" y="340" width="568" height="109" rx="15" fill="#eff8f8" stroke="#087f8c" stroke-width="2"/>
<text x="1222" y="360" fill="#087f8c" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">运动台定位</text>
<text x="1222" y="406" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">1.40  |  0.85 nm</text>
