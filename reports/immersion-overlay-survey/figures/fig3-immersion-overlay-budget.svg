<text x="1222" y="826" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">0.85  |  0.50 nm</text>
<rect x="1200" y="900" width="568" height="109" rx="15" fill="#eff8f8" stroke="#087f8c" stroke-width="2"/>
<text x="1222" y="920" fill="#087f8c" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">晶圆夹持</text>
<text x="1222" y="966" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">0.55  |  0.35 nm</text>
<rect x="1200" y="1040" width="568" height="109" rx="15" fill="#eff8f8" stroke="#087f8c" stroke-width="2"/>
<text x="1222" y="1060" fill="#087f8c" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" dominant-baseline="text-before-edge">掩模夹持 / 热</text>
<text x="1222" y="1106" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge">0.65  |  0.40 nm</text>
<rect x="42" y="1195" width="1726" height="99" rx="15" fill="#f2f6fa" stroke="#98aabd" stroke-width="2"/>
<text x="64" y="1213" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">依据：六类物理分支参考 1950i 技术论文图 3；整机锚点来自 ASML 官方资料（正文表 1）。</text>
<text x="64" y="1255" fill="#52687d" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">本图止于机台层；产品掩模、前道 / 刻蚀、EPE 与量测验收不确定度需另建边界，不是本图结果。</text>
