<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1340" viewBox="0 0 1810 1340">
<rect width="100%" height="100%" fill="white"/>
<text x="42" y="30" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="38" font-weight="700" dominant-baseline="text-before-edge">图 3  浸没式 ArF 套刻建议预算：1950i 水平与 1980Di 水平</text>
<text x="42" y="88" fill="#52687d" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">A | B = NXT:1950i 历史基线 | NXT:1980Di；内部配额均为本文建议值，不是 ASML 披露值。</text>
<rect x="42" y="140" width="1726" height="102" rx="15" fill="#fff8e9" stroke="#b67718" stroke-width="2"/>
<text x="64" y="158" fill="#b67718" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">子项 u = 3σ，晶圆面单轴、曝光对之差、校正后残差；初始假设各桶不相关。</text>
<text x="64" y="201" fill="#172e46" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge">均值界 B 在各输出单列；Q = B + R，R = RSS(u)。厂家指标仅作为数值锚点，统计口径尚需对齐。</text>
<text x="42" y="280" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">整机匹配输出</text>
<text x="600" y="280" fill="#16324f" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">单机基线 + 新增匹配残差</text>
<text x="1200" y="280" fill="#087f8c" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" dominant-baseline="text-before-edge">DCO：六类物理贡献</text>
